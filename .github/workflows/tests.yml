name: Tests

# Only when code, its configuration or the environment change: a pull request
# that touches only documentation or notebooks does not run the tests.
on:
  push:
    branches: [main]
    paths:
      - "opera_ds/**"
      - "scripts/**"
      - "tests/**"
      - "configs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "opera_ds/**"
      - "scripts/**"
      - "tests/**"
      - "configs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/tests.yml"

jobs:
  tests:
    name: Synthetic end-to-end test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -v
