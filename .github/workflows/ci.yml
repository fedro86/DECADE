name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Notebooks stripped, no large files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
