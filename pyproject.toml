[project]
name = "opera-ds"
version = "0.1.0"
description = "Pan-European radar datasets from EUMETNET OPERA: ODYSSEY (2 km / 15 min) downscaled to 1 km / 5 min"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "h5py",
    "matplotlib",
    "pyproj",
    "shapely",
    "pyshp",
    "zarr>=3",
    "rasterio",
]

[project.optional-dependencies]
pysteps = ["pysteps"]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "pytest",
    "pre-commit",
    "nbstripout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opera_ds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
