[project]
name = "opera-ds"
version = "0.1.0"
description = "Harmonisation of the OPERA ODYSSEY archive (2 km / 15 min) to 1 km / 5 min with a method built on pan-European data, piloted over Belgium"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "h5py",
    "matplotlib",
    "pyproj",
    "shapely",
    "pyshp",
    "zarr>=3",
    "rasterio",
    "wradlib>=2.9.6",
    "cdsapi>=0.7.7",
    "xarray>=2026.9.0",
    "h5netcdf>=1.8.2",
]

[project.optional-dependencies]
pysteps = ["pysteps"]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "pytest",
    "pre-commit",
    "nbstripout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opera_ds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
